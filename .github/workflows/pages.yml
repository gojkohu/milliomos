# Közzététel GitHub Pages-en a main ágra kerülő változásokkor.
name: Közzététel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  kozzetesz:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.telepites.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: telepites
        uses: actions/deploy-pages@v4
