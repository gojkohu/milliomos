# Közzététel GitHub Pages-en a main ágra kerülő változásokkor.
name: Közzététel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  osszeallit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oldal összeállítása
        run: |
          mkdir _site
          cp *.html *.css *.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  kozzetesz:
    needs: osszeallit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.telepites.outputs.page_url }}
    steps:
      - id: telepites
        uses: actions/deploy-pages@v4
